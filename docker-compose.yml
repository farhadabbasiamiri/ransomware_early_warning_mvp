# Local only (course requirement: no cloud deployment).
# docker compose up -d && docker compose exec ollama ollama pull qwen2.5:7b-instruct
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
  app:
    build: .
    environment:
      REWA_LLM_PROVIDER: ollama
      REWA_LLM_BASE_URL: http://ollama:11434
      REWA_LLM_MODEL: qwen2.5:7b-instruct
    ports: ["127.0.0.1:7860:7860"]
    depends_on: [ollama]
volumes:
  ollama: {}
